name: Install problem or error
description: Agent Task Hub won't install, the pane doesn't open, or it shows an error.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Remove any private details, file paths or secrets from error messages before posting.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you typed, and what you saw instead of what you expected. Paste the error message if there was one.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Shown by `claude --version`.
  - type: input
    id: version
    attributes:
      label: Agent Task Hub version
      description: Shown by `claude plugin list`.
      placeholder: "0.2.1"
